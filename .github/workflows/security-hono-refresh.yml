name: One-shot Hono remediation

on:
  push:
    branches:
      - security/hono-remediation-05
    paths:
      - .github/workflows/security-hono-refresh.yml

# Branch-only dependency remediation. Deleted before the PR is merged.
# No production secrets are supplied; the token may write repository contents only.
permissions:
  contents: write

concurrency:
  group: security-hono-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.repository == 'pixatrip1984/LMWARES' &&
      github.ref == 'refs/heads/security/hono-remediation-05' &&
      github.actor == 'pixatrip1984'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned
        with:
          ref: security/hono-remediation-05
          fetch-depth: 1
          persist-credentials: true

      - name: Configure Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify expected starting state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ['workers/public-api/package.json', 'workers/admin-api/package.json']) {
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (pkg.dependencies?.hono !== '4.12.27') {
              throw new Error(`${path}: expected hono 4.12.27 before remediation`);
            }
          }
          NODE

      - name: Resolve npm-audit recommended Hono fix
        id: target
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > .npm-audit-before.json || true
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.npm-audit-before.json', 'utf8'));
          const vulnerability = report.vulnerabilities?.hono;
          if (!vulnerability) throw new Error('Expected current Hono vulnerability was not reported; stop and review state manually.');
          const fix = vulnerability.fixAvailable;
          if (!fix || typeof fix !== 'object' || typeof fix.version !== 'string') {
            throw new Error('npm audit did not provide an exact Hono fix version.');
          }
          if (!/^4\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(fix.version)) {
            throw new Error(`Refusing unexpected Hono target version: ${fix.version}`);
          }
          if (fix.isSemVerMajor === true) {
            throw new Error(`Refusing semver-major Hono remediation target: ${fix.version}`);
          }
          console.log(`version=${fix.version}`);
          NODE
          rm -f .npm-audit-before.json

      - name: Regenerate lockfile without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact \
            "hono@${{ steps.target.outputs.version }}" \
            --workspace=workers/public-api \
            --workspace=workers/admin-api

      - name: Verify dependency result and changed-file boundary
        shell: bash
        run: |
          set -euo pipefail
          TARGET='${{ steps.target.outputs.version }}'
          TARGET="$TARGET" node <<'NODE'
          const fs = require('node:fs');
          const target = process.env.TARGET;
          for (const path of ['workers/public-api/package.json', 'workers/admin-api/package.json']) {
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (pkg.dependencies?.hono !== target) {
              throw new Error(`${path}: hono was not pinned to ${target}`);
            }
          }
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const workspace of ['workers/public-api', 'workers/admin-api']) {
            if (lock.packages?.[workspace]?.dependencies?.hono !== target) {
              throw new Error(`package-lock.json: ${workspace} is not pinned to hono ${target}`);
            }
          }
          if (lock.packages?.['node_modules/hono']?.version !== target) {
            throw new Error(`package-lock.json: node_modules/hono expected ${target}`);
          }
          NODE

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "package-lock.json"
            "workers/admin-api/package.json"
            "workers/public-api/package.json"
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected changed files after Hono remediation:\n'
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi
          git diff --check

      - name: Verify Hono production advisories are removed
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > .npm-audit-after.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.npm-audit-after.json', 'utf8'));
          if (report.vulnerabilities?.hono) {
            const v = report.vulnerabilities.hono;
            const advisories = (Array.isArray(v.via) ? v.via : [])
              .filter((entry) => entry && typeof entry === 'object')
              .map((entry) => ({ severity: entry.severity, title: entry.title, url: entry.url, range: entry.range }));
            console.error(JSON.stringify({ package: 'hono', severity: v.severity, range: v.range, fixAvailable: v.fixAvailable, advisories }));
            throw new Error('Recommended Hono remediation target remains vulnerable; refusing to commit it.');
          }
          NODE
          rm -f .npm-audit-after.json

      - name: Commit generated dependency state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- workers/public-api/package.json workers/admin-api/package.json package-lock.json
          git diff --cached --check
          git commit -m "security: patch Hono production advisories"
          git push origin HEAD:security/hono-remediation-05
