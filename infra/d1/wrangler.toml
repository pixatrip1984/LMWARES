# Config exclusiva para gestionar la base D1 (migraciones/seeds) con Wrangler.
# Los Workers tienen su propio wrangler.toml; comparten la MISMA base D1.
name = "starter-d1"
compatibility_date = "2026-06-28"

# El UUID neutral coincide con los Workers locales y mantiene una sola base
# persistida para setup, migraciones, seed y desarrollo.
[[d1_databases]]
binding = "DB"
database_name = "starter-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Las operaciones remotas deben declarar `--env production`; así nunca se
# mezclan accidentalmente la simulación local y la base real de LMWares.
[env.production]
name = "starter-d1-production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "starter-db"
database_id = "682732b7-8517-416d-ac7c-6789e491fe43"
migrations_dir = "migrations"
