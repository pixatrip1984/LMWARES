name = "lmwares-security-2a-local"
main = "src/security-2a-test-worker.ts"
compatibility_date = "2026-06-28"
workers_dev = false

[vars]
MERCADO_PAGO_COMMERCIAL_ACCESS_TOKEN = "security-2a-synthetic-token"
MERCADO_PAGO_COMMERCIAL_WEBHOOK_SECRET = "security-2a-synthetic-webhook-secret"
MERCADO_PAGO_MAINTENANCE_ACCESS_TOKEN = "security-2a-synthetic-maintenance-token"
MERCADO_PAGO_MAINTENANCE_WEBHOOK_SECRET = "security-2a-synthetic-maintenance-webhook-secret"

[[d1_databases]]
binding = "DB"
database_name = "starter-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../infra/d1/migrations"
