name = "starter-public-api"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# Config NO sensible. Los secretos van en .dev.vars (local) o `wrangler secret put`.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173"
MEDIA_BASE_URL = ""
PROJECT_SLUG = "starter"
# En local deja "1" para saltar Turnstile. En producción pon "0".
TURNSTILE_DISABLED = "1"

[[d1_databases]]
binding = "DB"
database_name = "starter-db"
database_id = "REEMPLAZAR_CON_TU_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "starter-media"
