name = "starter-public-api"
main = "src/index.ts"
compatibility_date = "2026-06-28"

# Config NO sensible. Los secretos van en .dev.vars (local) o `wrangler secret put`.
[vars]
ALLOWED_ORIGINS = "http://localhost:5273,http://127.0.0.1:5273,http://localhost:5274,http://127.0.0.1:5274,http://localhost:4273,http://127.0.0.1:4273,http://localhost:4274,http://127.0.0.1:4274"
MEDIA_BASE_URL = ""
PROJECT_SLUG = "starter"
FREE_SITE_BASE_DOMAIN = "lmwares.com"
PUBLIC_WEB_URL = "http://127.0.0.1:5273"
PUBLIC_API_URL = "http://127.0.0.1:8887"
MAP_SEARCH_BASE_URL = "https://nominatim.openstreetmap.org"
MAP_SUGGEST_BASE_URL = "https://photon.komoot.io"
EMAIL_FROM = "notificaciones@lmwares.com"
EMAIL_REPLY_TO = "soporte@lmwares.com"

[[d1_databases]]
binding = "DB"
database_name = "starter-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "starter-media"

[[queues.producers]]
binding = "FREE_JOBS_QUEUE"
queue = "lmwares-free-jobs"

# En local Wrangler simula los envíos y guarda/loguea el mensaje.
# Producción requiere habilitar lmwares.com en Cloudflare Email Sending.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["notificaciones@lmwares.com"]

# Ambiente remoto de LMWares. Mantiene arriba el desarrollo local y evita
# desplegar por accidente URLs de loopback o el UUID neutral de D1.
[env.production]
name = "starter-public-api"
routes = [
  { pattern = "api.lmwares.com", custom_domain = true },
  { pattern = "*.lmwares.com/*", zone_name = "lmwares.com" }
]

[env.production.vars]
ALLOWED_ORIGINS = "https://lmwares.com,https://www.lmwares.com,https://contratar.lmwares.com,https://lmwares-public.pages.dev"
MEDIA_BASE_URL = ""
PROJECT_SLUG = "lmwares"
FREE_SITE_BASE_DOMAIN = "lmwares.com"
PUBLIC_WEB_URL = "https://contratar.lmwares.com"
PUBLIC_API_URL = "https://api.lmwares.com"
MAP_SEARCH_BASE_URL = "https://nominatim.openstreetmap.org"
MAP_SUGGEST_BASE_URL = "https://photon.komoot.io"
EMAIL_FROM = "notificaciones@lmwares.com"
EMAIL_REPLY_TO = "soporte@lmwares.com"
TURNSTILE_DISABLED = "0"
# Puerta temporal para validar credenciales y pagos TEST. Debe eliminarse o
# cambiarse a "0" antes de aceptar cobros reales.
MERCADO_PAGO_TEST_MODE = "1"
# Conserva la verificación/reconciliación del ensayo existente, pero impide
# crear nuevos cobros técnicos desde el API público.
MERCADO_PAGO_TECHNICAL_CHECKOUT_ENABLED = "0"
# El código comercial se despliega cerrado. Se habilita sólo después de cargar
# credenciales productivas separadas y validar un cobro real controlado.
MERCADO_PAGO_COMMERCIAL_PAYMENTS_ENABLED = "1"
MERCADO_PAGO_COMMERCIAL_TEST_MODE = "0"
MERCADO_PAGO_MAINTENANCE_SUBSCRIPTIONS_ENABLED = "1"
MERCADO_PAGO_MAINTENANCE_TEST_MODE = "0"
# Destino de alertas operativas (pagos que el cron no logra reconciliar).
ADMIN_ALERT_EMAIL = "lmwareservice@gmail.com"

[env.production.triggers]
crons = ["17 * * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "starter-db"
database_id = "682732b7-8517-416d-ac7c-6789e491fe43"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "starter-media"

[[env.production.queues.producers]]
binding = "FREE_JOBS_QUEUE"
queue = "lmwares-free-jobs"

[[env.production.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["notificaciones@lmwares.com"]
allowed_destination_addresses = ["lmwareservice@gmail.com"]
