name = "starter-admin-api"
main = "src/index.ts"
compatibility_date = "2026-06-28"
workers_dev = false

# Fase 2 (admin con Access): descomenta y reemplaza <DOMINIO>.
# IMPORTANTE: 'routes' va a NIVEL SUPERIOR (antes de [vars]); si queda dentro
# de [vars], wrangler lo trata como variable y NO aplica las rutas.
# routes = [
#   { pattern = "admin.<DOMINIO>/admin/*", zone_name = "<DOMINIO>" },
#   { pattern = "admin.<DOMINIO>/health",  zone_name = "<DOMINIO>" }
# ]

[vars]
ALLOWED_ORIGINS = "http://localhost:5274,http://127.0.0.1:5274,http://localhost:4274,http://127.0.0.1:4274"
MEDIA_BASE_URL = ""
MEDIA_BUCKET_NAME = "starter-media"
# URL del Public API para previsualizar imágenes (o usa MEDIA_BASE_URL/CDN).
PUBLIC_API_URL = "http://127.0.0.1:8887"
PROJECT_SLUG = "starter"
# Dominio del equipo de Access (incluye https://). Reemplaza por el tuyo.
ACCESS_TEAM_DOMAIN = "https://REEMPLAZAR.cloudflareaccess.com"
# AUD tag de la aplicación de Access que protege este Worker.
ACCESS_AUD = "REEMPLAZAR_CON_TU_AUD"
# Crea automáticamente un AdminUser (rol viewer) al primer login válido.
AUTO_PROVISION_ADMINS = "0"
# En local se usa el Admin owner sembrado y el header X-Dev-Email; en producción
# Access permanece obligatorio y el allowlist se define en [env.production.vars].
ADMIN_EMAIL_ALLOWLIST = "admin@example.com"
ACCESS_DISABLED = "1"
TEST_FIXTURES_ENABLED = "1"

[[d1_databases]]
binding = "DB"
database_name = "starter-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "starter-media"

# Ambiente remoto de LMWares. Pages sirve la SPA en admin.lmwares.com y este
# Worker intercepta únicamente la API y el health check bajo el mismo origen.
# Cloudflare Access protege el hostname completo y el middleware vuelve a
# validar el JWT antes de permitir cualquier operación /admin/*.
[env.production]
name = "starter-admin-api"
routes = [
  { pattern = "admin.lmwares.com/admin/*", zone_name = "lmwares.com" },
  { pattern = "admin.lmwares.com/sales/*", zone_name = "lmwares.com" },
  { pattern = "admin.lmwares.com/health", zone_name = "lmwares.com" }
]

[env.production.vars]
ALLOWED_ORIGINS = "https://admin.lmwares.com"
CLOUDFLARE_ZONE_ID = "fa8b7b1e5c20243be0e49ec794167eca"
CLOUDFLARE_SAAS_CNAME_TARGET = "customers.lmwares.com"
MEDIA_BASE_URL = ""
MEDIA_BUCKET_NAME = "starter-media"
PUBLIC_API_URL = "https://api.lmwares.com"
PROJECT_SLUG = "lmwares"
ACCESS_TEAM_DOMAIN = "https://lmwares.cloudflareaccess.com"
ACCESS_AUD = "f4e643927f9d80e438f3f4d340a889444e0beaf5d21f6994991ebd4a0896a7d6"
# Fail closed until the exact Access identities are supplied at deploy time.
ADMIN_EMAIL_ALLOWLIST = "lmwareservice@gmail.com"
AUTO_PROVISION_ADMINS = "0"
ACCESS_DISABLED = "0"
TEST_FIXTURES_ENABLED = "0"

[[env.production.d1_databases]]
binding = "DB"
database_name = "starter-db"
database_id = "682732b7-8517-416d-ac7c-6789e491fe43"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "starter-media"
